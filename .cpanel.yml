---
deployment:
  tasks:
    - export SITE=/home1/revision/multiexamsportal.co.ke/
    - export ADMIN=/home1/revision/admin.multiexamsportal.co.ke/
        - export API=/home1/revision/multiexams-api/

    # 1. Frontend build to multiexamsportal.co.ke (the "." also copies .htaccess)
    - /bin/cp -R frontend/dist/. $SITE

    # 2. Admin pages to admin.multiexamsportal.co.ke
    - /bin/cp frontend/dist/upload.html $ADMIN
    - /bin/cp frontend/dist/payment-history.html $ADMIN
    # 3. William's API, in its own folder (never /home1/revision/backend/)
    - /bin/mkdir -p $API
    - /bin/cp -R backend/dist $API
    - /bin/cp backend/package.json $API
    - /bin/cp backend/package-lock.json $API